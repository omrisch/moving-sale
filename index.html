<body>

<header>
  <a class="nav-link" id="infoLink" href="info.html">Pickup info</a>

  </div>
  <h1 id="title">Moving Sale</h1>
  <p id="subtitle">Everything must go. Message us for anything you'd like.</p>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="admin-login-btn" id="loginBtn">Admin login</button>
    <div class="controls admin-bar" id="adminBar" hidden>

    </div>
    <div class="controls">

    </div>
    <div class="controls filters" id="statusFilters"></div>
    <div class="controls filters" id="categoryFilters"></div>
    <div class="controls filters" id="roomFilters"></div>
    <div class="controls price-range">

    <div class="controls price-range">

    <div id="error" style="display:none">Couldn't load the list. Try again in a minute.</div>
    <div id="empty" style="display:none">No items match.</div>
    <div id="grid"></div>
    <div id="scrollSentinel"></div>
  </main>
</div>
<dialog id="itemView"><button class="view-close" aria-label="Close">✕</button><div id="itemViewBody"></div></dialog>
<button id="cartBtn" class="cart-btn" hidden></button>
<dialog id="cartDialog">
  <div class="cart-head"><h3 id="cartTitle"></h3><button id="cartClose" aria-label="Close">✕</button></div>
  <ul id="cartList"></ul>
  <div id="cartTotal"></div>
  <a id="cartSend" class="wa-btn" target="_blank" rel="noopener"></a>
</dialog>

  <div class="cart-head"><h3 id="pickupTitle"></h3><button data-close aria-label="Close">✕</button></div>

  <a class="pickup-opt" data-place="other" target="_blank" rel="noopener"></a>
  <a id="pickupMap" href="info.html" target="_blank"></a>
</dialog>
<!-- Admin only. English-only on purpose: it's just us. -->
<dialog id="loginDialog">
  <form id="loginForm" class="admin-form">
    <h3>Admin login</h3>
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="form-error" id="loginError"></div>
    <div class="form-actions"><button type="button" data-close>Cancel</button><button type="submit">Log in</button></div>

</dialog>
<dialog id="itemDialog">

    <label>Name<input name="item" required></label>
    <label>Name (Hebrew)<input name="item_he" dir="rtl"></label>
    <label>Category<input name="category" list="categoryList"></label>

    <label>Room<input name="room" list="roomList"></label>
    <label>Price (₪)<input name="price" type="number" min="0" step="1" inputmode="numeric"></label>
    <label>Status<select name="status"></select></label>
    <label>Available from<input name="available_from" type="date"></label>
    <label>Description<textarea name="description" rows="3"></textarea></label>
    <label>Description (Hebrew)<textarea name="description_he" rows="3" dir="rtl"></textarea></label>
    <div id="formPhotos"></div>
    <label>Add photos<input type="file" id="photoInput" accept="image/*" multiple></label>
    <div class="form-error" id="formError"></div>

<script type="module">

// database rules in schema.sql decide what visitors can read (no Inactive items) and that only
// admins can write.
const SUPABASE_URL = "https://seuigtqgmjpmljbkgtur.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Q0c-IvCCLF4e5-o5fs3ZXQ_4xwZZS2f";
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const PHOTO_BUCKET = "item-photos";

// WhatsApp number (with country code, no + or spaces) that "Message on WhatsApp" links to.
const WHATSAPP_NUMBER = "972547998212";

const STATUSES = ["For Sale", "Free", "Available Soon", "Reserved", "Sold", "Given Away"];
const ALL_STATUSES = [...STATUSES, "Inactive"]; // Inactive = hidden from visitors, admins still see it

let isAdmin = false; // set in init() from the saved login

// ponytail: fixed UI vocab is translated by hand here. Free-text item data (Item/Category/Description)
// is translated by adding "Item (HE)" / "Category (HE)" / "Description (HE)" columns in the Sheet —
// no translation API, no dependency, never breaks.
const I18N = {

    waPickup: { home: "I'd pick up in Ramat Gan (near Sderot HaTzanhanim).", office: "I'd pick up in Tel Aviv (near Sarona).", other: "Neither pickup spot works for me, could we arrange something else?" },
  },
  he: {

    allCategories: "כל הקטגוריות",
    allRooms: "כל החדרים",
    statusLabel: { "For Sale": "למכירה", "Free": "ללא תשלום", "Available Soon": "בקרוב", "Reserved": "שמור", "Sold": "נמכר", "Given Away": "נמסר", "Inactive": "מוסתר" },

    sortPriceAsc: "מחיר (נמוך לגבוה)",
    sortPriceDesc: "מחיר (גבוה לנמוך)",
    sortName: "שם (א-ת)",
    sortDate: "תאריך (הקרוב ביותר)",
    sortRoom: "חדר (א-ת)",
    linkToItem: "מידע נוסף",
    fields: { category: "קטגוריה", room: "חדר", price: "מחיר", status: "סטטוס", available: "זמין החל מ", description: "תיאור" },
    waMessage: (name, priceText) => `היי! מתעניין/ת ב"${name}"${priceText ? ` (${priceText})` : ""} ממכירת המעבר. זה עדיין קיים?`,

    cartSend: "שליחת הרשימה בוואטסאפ",
    waList: (lines, total) => `היי! מתעניין/ת בפריטים האלה ממכירת המעבר:\n${lines}\n\nסה״כ: ${total}. הם עדיין קיימים?`,
    pickupTitle: "איפה נוח לך לאסוף?",
    pickupHome: ["רמת גן", "ליד שדרות הצנחנים · רוב הפריטים"],
    pickupOffice: ["תל אביב", "ליד שרונה · פריטים קטנים בלבד"],
    pickupOther: ["משהו אחר", "משלוח, מקום או זמן אחר, תשאלו אותנו"],
    pickupMap: "לראות את שניהם על מפה",
    waPickup: { home: "אאסוף ברמת גן (ליד שדרות הצנחנים).", office: "אאסוף בתל אביב (ליד שרונה).", other: "שתי נקודות האיסוף לא מתאימות לי, אפשר לתאם משהו אחר?" },
  },
};

// ponytail: hand-rolled fuzzy match (subsequence match per query word) instead of a fuzzy-search library
function isSubsequence(needle, haystack) {
  let i = 0;
  for (let j = 0; j < haystack.length && i < needle.length; j++) {
    if (haystack[j] === needle[i]) i++;
  }
  return i === needle.length;
}
// Each query word must be a subsequence of a single haystack token (not spanning across words) —
// matching against the whole concatenated haystack let letters from unrelated adjacent fields
// (and long URLs) accidentally line up into false positives.
function fuzzyMatch(query, text) {
  const words = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!words.length) return true;
  const tokens = text.toLowerCase().split(/\s+/).filter(Boolean);
  return words.every(w => tokens.some(tok => isSubsequence(w, tok)));
}

// Displayed text for an item field: falls back to the English column if no "(HE)" translation is filled in.
function localField(it, lang, field) {
  return (lang === "he" && it[`${field} (HE)`]) || it[field] || "";
}

// Database row -> the field names the rest of this page uses (they date from the sheet era).
function toItem(r, i) {
  return {
    id: r.id, _row: i, photos: r.photos, Status: r.status, Room: r.room || "",
    Item: r.item, "Item (HE)": r.item_he || "",
    Category: r.category || "", "Category (HE)": r.category_he || "",
    Description: r.description || "", "Description (HE)": r.description_he || "",
    Price: r.price == null ? "" : String(r.price), Date: r.available_from || "",
    created: r.created_at,
  };
}

// Strips a trailing product URL out of Description text before it's used as search haystack —
// otherwise the subsequence fuzzy matcher below spuriously matches short queries against the long
// URL itself (e.g. "guitar" is a subsequence of almost any 80-char URL).
function stripUrl(desc) {
  return desc.replace(/https?:\/\/\S+/g, "");
}

// Description free text may end with a plain URL (original retailer link, pasted from research) —
// show it as a "Link to item" hyperlink instead of the raw URL string.
function formatDescription(desc, lang) {
  const match = desc.match(/https?:\/\/\S+/);
  if (!match) return desc;
  const url = match[0];
  const before = desc.slice(0, match.index).trim();
  const link = `<a href="${url}" target="_blank" rel="noopener">${I18N[lang].linkToItem}</a>`;
  return before ? `${before} — ${link}` : link;
}

const priceText = (it, lang) => it.Status === "Free" ? I18N[lang].freePrice : (it.Price ? `₪${it.Price}` : "");
const isClaimed = it => it.Status === "Sold" || it.Status === "Given Away";
// NEW badge: added in the last 7 days. ponytail: rows from before LAUNCH are the one-time sheet
// copy (all stamped 2026-11-07), not new arrivals; the cutoff is moot after 2026-11-14.
const LAUNCH = Date.parse("2026-11-08"), WEEK_MS = 7 * 864e5;
const isNew = it => !isClaimed(it) && Date.parse(it.created) >= Math.max(LAUNCH, Date.now() - WEEK_MS);
const waUrl = msg => `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;

function whatsappLink(it, lang) {
  return waUrl(I18N[lang].waMessage(localField(it, lang, "Item"), priceText(it, lang)));
}

// photos holds storage paths (uploaded from the admin form) or full URLs (older Drive links).
// The first is the card cover; the dialog shows all of them. Drive share links aren't images, so
// they're rewritten to Drive's direct image endpoint.
const photoUrl = p => {
  if (!/^https?:/.test(p)) return `${SUPABASE_URL}/storage/v1/object/public/${PHOTO_BUCKET}/${p}`;
  const m = p.match(/drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w1000` : p;
};
const photoUrls = it => (it.photos || []).map(photoUrl);

// Cart: a list of item ids kept in localStorage. Checkout = one WhatsApp message listing
// everything, with the total.
const CART_KEY = "moving-sale-cart";
let allItems = [];
let cart = (() => { try { const v = JSON.parse(localStorage.getItem(CART_KEY)); return Array.isArray(v) ? v : []; } catch { return []; } })();
const saveCart = () => { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch {} };
const cartItems = () => cart.map(id => allItems.find(it => it.id === id)).filter(Boolean);

function syncCartToggle(card) {
  const btn = card.querySelector(".cart-toggle");
  if (!btn) return;
  const on = cart.includes(card._item.id);
  btn.classList.toggle("in-cart", on);
  btn.textContent = I18N[renderState.lang][on ? "inCart" : "addToCart"];
}

function renderCart() {
  const lang = renderState.lang, t = I18N[lang], list = cartItems();
  const btn = document.getElementById("cartBtn");
  btn.hidden = !list.length;
  btn.textContent = t.cartBtn(list.length);
  document.getElementById("cartTitle").textContent = t.cartTitle;
  document.getElementById("cartList").innerHTML = list.map((it, i) =>
    `<li><span>${localField(it, lang, "Item")}</span><span class="price">${priceText(it, lang)}</span><button data-i="${i}" aria-label="Remove">✕</button></li>`).join("");
  // Free = 0; unpriced items just don't add to the total
  const total = list.reduce((sum, it) => sum + (it.Status === "Free" ? 0 : parseFloat(String(it.Price).replace(/,/g, "")) || 0), 0);
  document.getElementById("cartTotal").textContent = `${t.cartTotal}: ₪${total}`;
  const lines = list.map((it, i) => `${i + 1}. ${localField(it, lang, "Item")}${priceText(it, lang) ? ` (${priceText(it, lang)})` : ""}`).join("\n");
  const send = document.getElementById("cartSend");
  send.textContent = t.cartSend;
  send.href = waUrl(t.waList(lines, `₪${total}`));
  if (!list.length && document.getElementById("cartDialog").open) document.getElementById("cartDialog").close();
}

// ponytail: Date column is free text; parsed with new Date() so ISO ("2026-08-01") sorts/filters
// reliably. Unparseable or blank dates just opt the item out of date filtering/badges/sort-to-top.
// Sorting/filtering always uses the English Date column — "Date (HE)" is display-only.
function parseItemDate(it) {
  if (!it.Date) return null;
  const d = new Date(it.Date);
  return isNaN(d.getTime()) ? null : d;
}

const localStatus = (it, lang) => I18N[lang].statusLabel[it.Status] || it.Status || "";
const localDate = (it, lang) => parseItemDate(it)?.toLocaleDateString(lang === "he" ? "he-IL" : "en-GB") || it.Date;

// ponytail: render in batches on scroll instead of all ~50 cards (+ their images) at once
const BATCH_SIZE = 8;
const renderState = { filtered: [], shown: 0, lang: "en" };

function buildCard(it, lang) {
  const t = I18N[lang];
  const claimed = isClaimed(it);
  const photos = photoUrls(it);
  const card = document.createElement("div");
  card._item = it;
  card.className = "card" + (claimed ? " claimed" : "");
  const statusClass = it.Status.toLowerCase().replace(/\s+/g, "-");
  const name = localField(it, lang, "Item") || "Untitled";
  const category = localField(it, lang, "Category");
  const description = localField(it, lang, "Description");
  card.innerHTML = `
    ${photos.length ? `<img src="${photos[0]}" alt="${name}" loading="lazy" class="thumb" onerror="this.remove()">` : ""}
    ${photos.length > 1 ? `<span class="photo-count">${photos.length} 📷</span>` : ""}
    ${isNew(it) ? `<span class="new-ribbon">${t.newBadge}</span>` : ""}
    <div class="body">
      <h3>${name}</h3>
      ${category ? `<div class="cat">${category}</div>` : ""}
      ${description ? `<div class="desc">${formatDescription(description, lang)}</div>` : ""}
      <div class="row">
        <span class="price">${it.Status === "Free" ? t.freePrice : (it.Price ? "₪" + it.Price : "")}</span>
        ${it.Status === "Available Soon" && it.Date ? "" : `<span class="badge ${statusClass}">${localStatus(it, lang)}</span>`}
      </div>
      ${it.Date ? `<span class="badge available-soon">${t.availableFrom(localDate(it, lang))}</span>` : ""}
      ${isAdmin ? `<div class="admin-row">
        <select class="admin-status">${ALL_STATUSES.map(s => `<option${s === it.Status ? " selected" : ""}>${s}</option>`).join("")}</select>
        <button class="admin-edit">Edit</button><button class="admin-delete">Delete</button>
      </div>` : ""}
      ${claimed ? "" : `<a class="wa-btn" href="${whatsappLink(it, lang)}" target="_blank" rel="noopener">${t.whatsapp}</a>`}
      ${claimed ? "" : `<button class="cart-toggle"></button>`}
    </div>`;
  syncCartToggle(card);
  return card;
}

function appendBatch() {
  const grid = document.getElementById("grid");
  const next = renderState.filtered.slice(renderState.shown, renderState.shown + BATCH_SIZE);
  next.forEach(it => grid.appendChild(buildCard(it, renderState.lang)));
  renderState.shown += next.length;
}

// ponytail: IntersectionObserver only fires on a state *change* — if the sentinel is
// already visible before and after render() (short filtered list), no new callback
// fires and appendBatch() never runs again. Keep filling while it's still in view.
function fillViewport() {
  const sentinel = document.getElementById("scrollSentinel");
  while (renderState.shown < renderState.filtered.length) {
    if (sentinel.getBoundingClientRect().top > window.innerHeight + 300) break;
    appendBatch();
  }
}

function render(items, filters, lang) {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const min = filters.priceMin === "" ? null : parseFloat(filters.priceMin);
  const max = filters.priceMax === "" ? null : parseFloat(filters.priceMax);
  const dateMax = filters.dateMax ? new Date(filters.dateMax) : null;
  let filtered = items.filter(it => {
    if (filters.status !== "All" && it.Status !== filters.status) return false;
    if (filters.category !== "All" && it.Category !== filters.category) return false;
    if (filters.room !== "All" && it.Room !== filters.room) return false;
    if (min !== null || max !== null) {
      const price = parseFloat(it.Price);
      if (isNaN(price)) return false;
      if (min !== null && price < min) return false;
      if (max !== null && price > max) return false;
    }
    if (dateMax) {
      const itemDate = parseItemDate(it);
      if (itemDate && itemDate > dateMax) return false;
    }
    if (!fuzzyMatch(filters.query, `${it.Item} ${it.Category} ${stripUrl(it.Description)} ${localField(it, lang, "Item")} ${localField(it, lang, "Category")} ${stripUrl(localField(it, lang, "Description"))}`)) return false;
    return true;
  });
  if (filters.sort === "name") {
    filtered.sort((a, b) => localField(a, lang, "Item").localeCompare(localField(b, lang, "Item")));
  } else if (filters.sort === "date") {
    // No date = already available now, so it sorts first (soonest), not last.
    filtered.sort((a, b) => (parseItemDate(a)?.getTime() ?? -Infinity) - (parseItemDate(b)?.getTime() ?? -Infinity));
  } else if (filters.sort === "room") {
    filtered.sort((a, b) => (a.Room || "").localeCompare(b.Room || ""));
  } else if (filters.sort === "priceAsc" || filters.sort === "priceDesc") {
    // Free = 0; no price listed sorts last either way
    const price = it => it.Status === "Free" ? 0 : (parseFloat(String(it.Price).replace(/,/g, "")) || null);
    const dir = filters.sort === "priceAsc" ? 1 : -1;
    const gone = it => it.Status === "Sold" || it.Status === "Given Away";
    filtered.sort((a, b) => gone(a) - gone(b) || (price(a) === null) - (price(b) === null) || dir * (price(a) - price(b)));
  } else {
    // Available now first, then reserved, coming soon, gone. Within each: a fixed shuffle (by uuid)
    // so NEW items mix in with older ones instead of all sitting on top.
    const rank = { "For Sale": 0, "Free": 0, "Reserved": 1, "Available Soon": 2, "Sold": 3, "Given Away": 3 };
    const shuffleKey = it => parseInt(it.id.slice(9, 13), 16);
    filtered.sort((a, b) => (rank[a.Status] ?? 2) - (rank[b.Status] ?? 2) || shuffleKey(a) - shuffleKey(b));
    // Sprinkle sold items in so the first screen shows things moving, not just stock. A sold item
    // follows ~1 in 4 live items, picked by the live item's uuid: scattered (no fixed column) but
    // stable across re-renders.
    const gone = filtered.filter(isClaimed), live = filtered.filter(it => !isClaimed(it));
    filtered = live.flatMap(it => parseInt(it.id.slice(0, 8), 16) % 4 === 0 && gone.length ? [it, gone.shift()] : [it]).concat(gone);
  }
  grid.innerHTML = "";
  empty.style.display = filtered.length ? "none" : "block";
  renderState.filtered = filtered;
  renderState.shown = 0;
  renderState.lang = lang;
  fillViewport();
  renderCart();
}

new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) fillViewport();
}, { rootMargin: "300px" }).observe(document.getElementById("scrollSentinel"));

// Click a card to see the item in a dialog: all photos + every detail, read-only.
function openItemView(it) {
  const lang = renderState.lang, t = I18N[lang], f = t.fields, photos = photoUrls(it);
  const row = (label, value) => value ? `<dt>${label}</dt><dd>${value}</dd>` : "";
  const description = localField(it, lang, "Description");
  const view = document.getElementById("itemView");
  view._item = it;
  document.getElementById("itemViewBody").innerHTML = `
    ${photos.length ? `<img class="view-main" src="${photos[0]}" alt="">` : ""}
    ${photos.length > 1 ? `<div class="view-thumbs">${photos.map((u, i) => `<img src="${u}" alt=""${i ? "" : ` class="active"`}>`).join("")}</div>` : ""}
    <div class="view-text">
      <h2>${localField(it, lang, "Item")}</h2>
      <dl>
        ${row(f.category, localField(it, lang, "Category"))}
        ${row(f.room, it.Room)}
        ${row(f.price, priceText(it, lang))}
        ${row(f.status, `<span class="badge ${it.Status.toLowerCase().replace(/\s+/g, "-")}">${localStatus(it, lang)}</span>`)}
        ${row(f.available, it.Date && localDate(it, lang))}
        ${row(f.description, description && formatDescription(description, lang))}
      </dl>
      ${isClaimed(it) ? "" : `<a class="wa-btn" href="${whatsappLink(it, lang)}" target="_blank" rel="noopener">${t.whatsapp}</a><button class="cart-toggle"></button>`}
    </div>`;
  syncCartToggle(view);
  view.showModal();
  view.scrollTop = 0;
}

document.getElementById("itemView").addEventListener("click", e => {
  const view = e.currentTarget;
  if (e.target === view || e.target.closest(".view-close")) return view.close(); // backdrop or ✕
  const thumb = e.target.closest(".view-thumbs img");
  if (thumb) {
    view.querySelector(".view-main").src = thumb.src;
    view.querySelectorAll(".view-thumbs img").forEach(i => i.classList.toggle("active", i === thumb));
  }
  if (e.target.closest(".cart-toggle")) {
    const id = view._item.id;
    cart = cart.includes(id) ? cart.filter(c => c !== id) : [...cart, id];
    saveCart();
    syncCartToggle(view);
    document.querySelectorAll(".card").forEach(syncCartToggle);
    renderCart();
  }
});

document.getElementById("grid").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (e.target.closest(".cart-toggle")) {
    const id = card._item.id;
    cart = cart.includes(id) ? cart.filter(c => c !== id) : [...cart, id];
    saveCart();
    syncCartToggle(card);
    renderCart();
    return;
  }
  if (e.target.closest(".admin-edit")) return openItemForm(card._item);
  if (e.target.closest(".admin-delete")) return deleteItem(card._item);
  if (card && !e.target.closest("a, select, button")) return openItemView(card._item);
});
// Admin status change: saved straight to the database, card updated in place.
document.getElementById("grid").addEventListener("change", async e => {
  if (!e.target.classList.contains("admin-status")) return;
  const sel = e.target, card = sel.closest(".card"), it = card._item;
  sel.disabled = true;
  try {
    const { data, error } = await supabase.from("items").update({ status: sel.value }).eq("id", it.id).select("id");
    if (error) throw error;
    // The database rules silently skip rows you may not change, so check one was saved.
    if (!data.length) throw new Error("not saved, try logging in again");
    it.Status = sel.value;
    card.replaceWith(buildCard(it, renderState.lang));
  } catch (err) {
    alert(`Couldn't update: ${err.message}`);
    sel.value = it.Status;
    sel.disabled = false;
  }
});

function buildFilterBar(containerId, allLabel, values, counts, labelFor, onChange) {
  const bar = document.getElementById(containerId);
  bar.innerHTML = "";
  let active = "All";
  ["All", ...values].forEach(value => {
    if (value !== "All" && !counts[value]) return;
    const btn = document.createElement("button");
    btn.textContent = value === "All" ? `${allLabel} (${counts.All})` : `${labelFor(value)} (${counts[value]})`;
    if (value === "All") btn.classList.add("active");
    btn.onclick = () => {
      active = value;
      [...bar.children].forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      onChange(active);
    };
    bar.appendChild(btn);
  });
  return () => active;
}

async function init() {
  const loading = document.getElementById("loading");
  const error = document.getElementById("error");
  const search = document.getElementById("search");
  const priceMin = document.getElementById("priceMin");
  const priceMax = document.getElementById("priceMax");
  const dateMax = document.getElementById("dateMax");
  const sortSelect = document.getElementById("sortSelect");

  let lang = localStorage.getItem("moving-sale-lang") || "en";

  const { data: { session } } = await supabase.auth.getSession();
  isAdmin = session?.user?.app_metadata?.role === "admin";
  document.getElementById("adminBar").hidden = !isAdmin;
  document.getElementById("loginBtn").hidden = isAdmin;
  try { isAdmin ? localStorage.setItem("skipgc", "t") : localStorage.removeItem("skipgc"); } catch {}

  function applyStaticText() {
    const t = I18N[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
    document.getElementById("title").textContent = t.title;
    document.getElementById("subtitle").textContent = t.subtitle;
    search.placeholder = t.searchPlaceholder;
    document.getElementById("priceLabel").textContent = t.priceLabel;
    document.getElementById("dateLabel").textContent = t.dateLabel;
    document.getElementById("sortLabel").textContent = t.sortLabel;
    document.getElementById("sortDefault").textContent = t.sortDefault;
    document.getElementById("sortPriceAsc").textContent = t.sortPriceAsc;
    document.getElementById("sortPriceDesc").textContent = t.sortPriceDesc;
    document.getElementById("sortName").textContent = t.sortName;
    document.getElementById("sortDate").textContent = t.sortDate;
    document.getElementById("sortRoom").textContent = t.sortRoom;
    document.getElementById("infoLink").textContent = t.infoLink;
    document.getElementById("loadingText").textContent = t.loading;
    error.textContent = t.error;
    document.getElementById("empty").textContent = t.empty;
    [...document.querySelectorAll("#langToggle button")].forEach(b =>
      b.classList.toggle("active", b.dataset.lang === lang));
  }
  applyStaticText();

  try {
    // Visitors never receive Inactive items (database rule); admins get them, to reactivate.
    const { data, error: dbError } = await supabase.from("items").select("*").order("created_at");
    if (dbError) throw dbError;
    const items = data.map(toItem);
    loading.style.display = "none";
    allItems = items;
    // Only prune after a successful load, so a failed fetch never empties someone's list.
    cart = cart.filter(id => items.some(it => it.id === id && !isClaimed(it)));
    saveCart();

    const statuses = isAdmin ? ALL_STATUSES : STATUSES;
    const statusCounts = { All: items.length };
    statuses.forEach(s => statusCounts[s] = items.filter(i => i.Status === s).length);
    const categories = [...new Set(items.map(i => i.Category).filter(Boolean))].sort();
    const categoryCounts = { All: items.length };
    categories.forEach(c => categoryCounts[c] = items.filter(i => i.Category === c).length);
    const rooms = [...new Set(items.map(i => i.Room).filter(Boolean))].sort();
    const roomCounts = { All: items.length };
    rooms.forEach(r => roomCounts[r] = items.filter(i => i.Room === r).length);
    // Category filter buttons show the (HE) translation from the first item that has one, English otherwise.
    const categoryLabel = c => {
      const t = I18N[lang];
      if (lang !== "he") return c;
      const withHe = items.find(i => i.Category === c && i["Category (HE)"]);
      return withHe ? withHe["Category (HE)"] : c;
    };

    let getStatus = () => "All";
    let getCategory = () => "All";
    let getRoom = () => "All";
    const rerender = () => render(items, {
      status: getStatus(),
      category: getCategory(),
      room: getRoom(),
      query: search.value,
      priceMin: priceMin.value,
      priceMax: priceMax.value,
      dateMax: dateMax.value,
      sort: sortSelect.value,
    }, lang);

    function rebuildFilters() {
      const t = I18N[lang];
      const prevStatus = getStatus ? getStatus() : "All";
      const prevCategory = getCategory ? getCategory() : "All";
      const prevRoom = getRoom ? getRoom() : "All";
      getStatus = buildFilterBar("statusFilters", t.allStatuses, statuses, statusCounts, s => t.statusLabel[s] || s, rerender);
      getCategory = buildFilterBar("categoryFilters", t.allCategories, categories, categoryCounts, categoryLabel, rerender);
      getRoom = buildFilterBar("roomFilters", t.allRooms, rooms, roomCounts, r => r, rerender);
      rerender();
    }
    rebuildFilters();

    search.oninput = rerender;
    priceMin.oninput = rerender;
    priceMax.oninput = rerender;
    dateMax.oninput = rerender;
    sortSelect.onchange = rerender;

    document.getElementById("langToggle").onclick = (e) => {
      const btn = e.target.closest("button[data-lang]");
      if (!btn || btn.dataset.lang === lang) return;
      lang = btn.dataset.lang;
      localStorage.setItem("moving-sale-lang", lang);
      applyStaticText();
      rebuildFilters();
    };
  } catch (e) {
    loading.style.display = "none";
    error.style.display = "block";
    console.error(e);
  }
}

document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());

document.getElementById("loginForm").onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target), err = document.getElementById("loginError");
  err.textContent = "";
  const { data, error } = await supabase.auth.signInWithPassword({ email: f.get("email"), password: f.get("password") });
  if (error) return err.textContent = error.message;
  if (data.user.app_metadata?.role !== "admin") {
    await supabase.auth.signOut();
    return err.textContent = "This account isn't an admin.";
  }
  location.reload();
};
document.getElementById("loginBtn").onclick = () => document.getElementById("loginDialog").showModal();
document.getElementById("logoutBtn").onclick = async () => { await supabase.auth.signOut(); location.reload(); };
document.getElementById("addItemBtn").onclick = () => openItemForm(null);

// Photos are re-encoded in the browser before upload: max 1600px, WebP (JPEG if the browser
// can't make WebP). Re-encoding through a canvas also drops metadata such as GPS location.
async function preparePhoto(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const canvas = Object.assign(document.createElement("canvas"), { width: Math.round(bmp.width * scale), height: Math.round(bmp.height * scale) });
  canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
  const encode = type => new Promise(r => canvas.toBlob(r, type, 0.85));
  const webp = await encode("image/webp");
  return webp?.type === "image/webp" ? webp : encode("image/jpeg");
}

const removePhotos = paths => {
  const own = paths.filter(p => !/^https?:/.test(p));
  // Best effort: a leftover file only costs a little storage.
  if (own.length) supabase.storage.from(PHOTO_BUCKET).remove(own).then(({ error }) => error && console.error(error));
};

let editing = null;  // item being edited, null = new
let formPhotos = []; // [{path}] already stored, or [{file, src}] picked but not uploaded yet

function renderFormPhotos() {
  document.getElementById("formPhotos").innerHTML = formPhotos.map((p, i) => `
    <div class="form-photo"><img src="${p.src || photoUrl(p.path)}" alt="">
      ${i ? `<button type="button" data-cover="${i}" title="Make cover">★</button>` : `<span class="cover-tag">Cover</span>`}
      <button type="button" data-remove="${i}" title="Remove">✕</button></div>`).join("");
}
document.getElementById("formPhotos").onclick = e => {
  const cover = e.target.dataset.cover, remove = e.target.dataset.remove;
  if (cover) formPhotos.unshift(...formPhotos.splice(+cover, 1));
  if (remove) formPhotos.splice(+remove, 1);
  renderFormPhotos();
};
document.getElementById("photoInput").onchange = e => {
  formPhotos.push(...[...e.target.files].map(file => ({ file, src: URL.createObjectURL(file) })));
  e.target.value = "";
  renderFormPhotos();
};

function openItemForm(it) {
  editing = it;
  const form = document.getElementById("itemForm");
  form.reset();
  document.getElementById("itemFormTitle").textContent = it ? "Edit item" : "Add item";
  document.getElementById("formError").textContent = "";
  form.status.innerHTML = ALL_STATUSES.map(s => `<option>${s}</option>`).join("");
  const options = key => [...new Set(allItems.map(i => i[key]).filter(Boolean))].sort().map(v => `<option value="${v}">`).join("");
  document.getElementById("categoryList").innerHTML = options("Category");
  document.getElementById("roomList").innerHTML = options("Room");
  if (it) {
    form.item.value = it.Item; form.item_he.value = it["Item (HE)"];
    form.category.value = it.Category; form.category_he.value = it["Category (HE)"];
    form.room.value = it.Room; form.price.value = it.Price; form.status.value = it.Status;
    form.available_from.value = it.Date;
    form.description.value = it.Description; form.description_he.value = it["Description (HE)"];
  }
  formPhotos = (it?.photos || []).map(path => ({ path }));
  renderFormPhotos();
  document.getElementById("itemDialog").showModal();
}

document.getElementById("itemForm").onsubmit = async e => {
  e.preventDefault();
  const form = e.target, save = document.getElementById("itemSave"), err = document.getElementById("formError");
  const v = name => form[name].value.trim() || null;
  save.disabled = true;
  err.textContent = "";
  const uploaded = [];
  try {
    const photos = [];
    for (const p of formPhotos) {
      if (p.path) { photos.push(p.path); continue; }
      save.textContent = `Uploading photo ${uploaded.length + 1}…`;
      const blob = await preparePhoto(p.file);
      const path = `${crypto.randomUUID()}.${blob.type === "image/webp" ? "webp" : "jpg"}`;
      const { error } = await supabase.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: blob.type, cacheControl: "31536000" });
      if (error) throw new Error(`Photo upload failed: ${error.message}`);
      uploaded.push(path);
      photos.push(path);
    }
    save.textContent = "Saving…";
    const row = {
      item: v("item"), item_he: v("item_he"), category: v("category"), category_he: v("category_he"),
      room: v("room"), price: v("price") === null ? null : parseInt(v("price"), 10), status: form.status.value,
      available_from: v("available_from"), description: v("description"), description_he: v("description_he"), photos,
    };
    const q = editing ? supabase.from("items").update(row).eq("id", editing.id) : supabase.from("items").insert(row);
    const { data, error } = await q.select("id");
    if (error) throw error;
    if (!data.length) throw new Error("Not saved. Try logging in again.");
    if (editing) removePhotos(editing.photos.filter(p => !photos.includes(p)));
    // ponytail: full reload after a save keeps counts/filters/sort right with zero extra code;
    // admin-only, so the lost scroll position is fine.
    location.reload();
  } catch (error) {
    removePhotos(uploaded);
    err.textContent = error.message;
    save.disabled = false;
    save.textContent = "Save";
  }
};

async function deleteItem(it) {
  if (!confirm(`Delete "${it.Item}"? This can't be undone.\n(To just hide it, set the status to Inactive.)`)) return;
  const { data, error } = await supabase.from("items").delete().eq("id", it.id).select("id");
  if (error || !data.length) return alert(`Couldn't delete: ${error?.message || "try logging in again"}`);
  removePhotos(it.photos);
  location.reload();
}

init();
